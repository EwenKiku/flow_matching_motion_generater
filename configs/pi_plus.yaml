# Pi Plus（22 自由度）。把 reactor_mjlab 导出的 Pi Plus 轨迹放到 motions 目录后再训练。
# https://github.com/EwenKiku/reactor_mjlab
name: pi_plus
xml: robots/pi_plus/xmls/pi_plus.xml
motions: data/pi_plus
checkpoint: checkpoints/pi_plus.pt
default_style: data/pi_plus/walk_hands_on_back_loop_001__A029.npz
anchor_body: base_link
fps: 50

joints:
  - r_shoulder_pitch_joint
  - r_shoulder_roll_joint
  - r_upper_arm_joint
  - r_elbow_joint
  - l_shoulder_pitch_joint
  - l_shoulder_roll_joint
  - l_upper_arm_joint
  - l_elbow_joint
  - head_yaw_joint
  - head_pitch_joint
  - r_hip_pitch_joint
  - r_hip_roll_joint
  - r_thigh_joint
  - r_calf_joint
  - r_ankle_pitch_joint
  - r_ankle_roll_joint
  - l_hip_pitch_joint
  - l_hip_roll_joint
  - l_thigh_joint
  - l_calf_joint
  - l_ankle_pitch_joint
  - l_ankle_roll_joint

bodies:
  - base_link
  - torso_link
  - head_pitch_link
  - l_shoulder_roll_link
  - l_upper_arm_link
  - l_elbow_link
  - l_wrist_link
  - r_shoulder_roll_link
  - r_upper_arm_link
  - r_elbow_link
  - r_wrist_link
  - l_thigh_link
  - l_calf_link
  - l_ankle_roll_link
  - r_thigh_link
  - r_calf_link
  - r_ankle_roll_link

# 足底点在踝滚转坐标系，取自脚跟/脚尖碰撞体的中点，高度在足底。
# contact_height 以下视为支撑。支撑脚损失的系数在 train.slip_weight。
feet:
  bodies:
    - l_ankle_roll_link
    - r_ankle_roll_link
  sole_point: [-0.025, 0.0, -0.05]
  contact_height: 0.025

viewer:
  title: Pi Plus | 风格参考与实时流匹配
  distance: 1.45
  lookat_height: 0.31
  elevation: -14
  azimuth_offset: 130
  speed_step: [0.05, 0.05, 0.10]

model:
  history: 15
  future: 30
  modes: 8
  width: 96
  layers: 3
  heads: 4
  style_seconds: 5

infer:
  steps: 5
  stride: 10
  style_bias: 1.0
  replan_delta: 0.15

train:
  steps: 10000
  batch_size: 64
  lr: 0.0004
  seed: 42
  log_interval: 100
  threads: 4
  max_clips: 0
  save_interval: 5000
  val_fraction: 0.05
  val_batches: 16
  # 各项损失的系数。日志里的同名分项已经乘过这里的权重。
  flow_weight: 1
  slip_weight: 1
  arm_mix_prob: 0
  pattern:
    - "*.npz"
